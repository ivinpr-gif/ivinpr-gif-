# Render.com Blueprint Configuration for Smart Campus Waste AI Microservice
services:
  - type: web
    name: smart-campus-yolo-service
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore # Choose closest region (singapore, oregon, frankfurt, ohio)
    plan: free # Free tier or Starter ($7/mo)
    healthCheckPath: /
    envVars:
      - key: YOLO_MODEL_PATH
        value: yolov8n.pt
      - key: WASTE_CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: PERSON_CONFIDENCE_THRESHOLD
        value: "0.35"
      - key: YOLO_IMAGE_SIZE
        value: "640"
